<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Wartungsarbeiten</title>
    <style>
      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        background: #f0f2f5 url('/dfg.webp') center / cover no-repeat fixed;
      }

      .card {
        background: rgba(255, 255, 255, 0.94);
        border-radius: 12px;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
        padding: 2.5rem 2rem;
        width: 100%;
        max-width: 420px;
        text-align: center;
      }

      h1 {
        font-size: 1.5rem;
        font-weight: 700;
        margin: 0 0 0.75rem;
        color: #1a1a2e;
      }

      p {
        margin: 0;
        font-size: 0.95rem;
        line-height: 1.5;
        color: #6b7280;
      }

      hr {
        border: none;
        border-top: 1px solid #e5e7eb;
        margin: 1.5rem 0;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Wartungsarbeiten</h1>
      <p>Die Anwendung ist wegen Wartungsarbeiten vorübergehend nicht erreichbar. Bitte versuche es später noch einmal.</p>
      <hr />
      <h1>Maintenance</h1>
      <p>L'application est temporairement indisponible pour cause de maintenance. Merci de réessayer plus tard.</p>
    </main>
  </body>
</html>
